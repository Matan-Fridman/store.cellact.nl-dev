# Staging store only. This repo must not deploy store.cellact.nl.
# Pushes the Vite dist to gh-pages. Do not use actions/deploy-pages.

name: Deploy staging GitHub Pages

on:
  push:
    branches: [staging-production]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_BASE_PATH: /store.cellact.nl-dev/
          VITE_BASE_URL: https://europe-west1-arnacon-staging-production.cloudfunctions.net
        run: npm run build

      - name: Prepare Pages tree
        run: |
          set -euo pipefail
          touch dist/.nojekyll
          rm -f dist/CNAME
          cp dist/index.html dist/404.html

      - name: Push dist to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cp -a dist/. "$work/"
          cd "$work"
          git init
          git checkout -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Deploy staging store."
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin gh-pages
