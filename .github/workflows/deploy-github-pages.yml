# Build the Vite SPA and deploy to GitHub Pages.
# Repo settings → Pages → Source: GitHub Actions (NOT "Deploy from a branch")
#
# Required secrets (production store.cellact.nl):
#   VITE_BASE_URL=https://europe-west1-arnacon-production-gcp.cloudfunctions.net
#   VITE_FIREBASE_*
#   VITE_RECAPTCHA_SITE_KEY
# Optional: VITE_META_PIXEL_ID
#
# Custom domain: store.cellact.nl (see public/CNAME)

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
  deployments: write

# One Pages deploy at a time. Never cancel mid-upload (lost artifacts).
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_BASE_PATH: /
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_META_PIXEL_ID: ${{ secrets.VITE_META_PIXEL_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        run: npm run build

      - name: Verify production build
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/404.html
          test -d dist/assets
          for r in activate claim success port port/complete; do
            test -f "dist/$r/index.html"
          done
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "Refusing to deploy: dist/index.html still points at /src/main.tsx"
            cat dist/index.html
            exit 1
          fi
          if ! grep -q '/assets/' dist/index.html; then
            echo "Refusing to deploy: dist/index.html has no /assets/ bundle"
            cat dist/index.html
            exit 1
          fi
          if ! grep -q '/assets/' dist/activate/index.html; then
            echo "Refusing to deploy: dist/activate/index.html is not a built SPA shell"
            cat dist/activate/index.html
            exit 1
          fi
          echo "Build OK (SPA route shells + 404.html):"
          ls -la dist/activate dist/claim dist/404.html
          head -30 dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages API returns 400 if another deployment is still "in progress".
      # Retry a few times instead of failing the release.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait and retry deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait and retry deploy again
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (retry 2)
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Confirm deploy succeeded
        if: >
          steps.deployment.outcome != 'success' &&
          steps.deployment_retry1.outcome != 'success' &&
          steps.deployment_retry2.outcome != 'success'
        run: |
          echo "All Pages deploy attempts failed (likely a stuck in-progress deployment)."
          echo "Cancel the stuck deployment in GitHub → Settings → Pages / Actions, then re-run this workflow."
          exit 1
