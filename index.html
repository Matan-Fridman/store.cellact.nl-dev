<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arnacon Phone Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f0f13;
            color: #f0ece6;
            min-height: 100vh;
        }

        .glow-bg {
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 500px;
            background: radial-gradient(ellipse, rgba(142,45,226,0.15), rgba(196,91,255,0.08), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        header {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 60px 20px 20px;
        }

        header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 0 40px rgba(142,45,226,0.3);
        }

        header p {
            color: #9a95a8;
            margin-top: 10px;
            font-size: 1rem;
            max-width: 520px;
            margin-left: auto;
            margin-right: auto;
        }

        .store-grid {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 24px 80px;
        }

        .product-card {
            background: #1a1a22;
            border: 1px solid #2a2a35;
            border-radius: 16px;
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .product-card:hover {
            border-color: #3d2d5c;
            box-shadow: 0 0 30px rgba(142,45,226,0.08);
        }

        .product-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(142,45,226,0.15), rgba(255,88,176,0.1));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .product-number {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
        }

        .product-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #7a7688;
            font-size: 0.85rem;
        }

        .btn-buy {
            background: #f0ece6;
            color: #0f0f13;
            border: none;
            border-radius: 10px;
            padding: 12px 0;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            position: relative;
            overflow: hidden;
        }

        .btn-buy:hover { opacity: 0.9; }
        .btn-buy:active { transform: scale(0.98); }

        .btn-buy:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-buy.processing {
            background: #2a2a35;
            color: #9a95a8;
        }

        .btn-buy.success {
            background: #1a3a2a;
            color: #4ade80;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: #1a1a22;
            border: 1px solid #2a2a35;
            border-radius: 20px;
            padding: 36px 32px;
            max-width: 480px;
            width: 100%;
            position: relative;
        }

        .modal h2 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .modal p {
            color: #9a95a8;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            color: #7a7688;
            font-size: 1.5rem;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        .modal-close:hover { background: #2a2a35; color: #f0ece6; }

        .secret-box {
            background: #0f0f13;
            border: 1px solid #2a2a35;
            border-radius: 12px;
            padding: 16px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.8rem;
            word-break: break-all;
            line-height: 1.6;
            color: #c4b5fd;
            margin-bottom: 16px;
            position: relative;
        }

        .secret-label {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7a7688;
            margin-bottom: 8px;
        }

        .btn-copy {
            background: #f0ece6;
            color: #0f0f13;
            border: none;
            border-radius: 10px;
            padding: 12px 0;
            width: 100%;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-copy:hover { opacity: 0.9; }

        .btn-copy.copied {
            background: #1a3a2a;
            color: #4ade80;
        }

        .warning {
            background: rgba(255,88,176,0.08);
            border: 1px solid rgba(255,88,176,0.2);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.82rem;
            color: #ff8cc8;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #7a7688;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .tx-link {
            font-size: 0.8rem;
            color: #9a95a8;
            margin-top: 12px;
            word-break: break-all;
        }

        .tx-link a {
            color: #c4b5fd;
            text-decoration: none;
        }

        .tx-link a:hover { text-decoration: underline; }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-badge.available {
            background: rgba(74,222,128,0.1);
            color: #4ade80;
        }

        .status-badge.sold {
            background: rgba(255,88,176,0.1);
            color: #ff8cc8;
        }
    </style>
</head>
<body>
    <div class="glow-bg"></div>

    <header>
        <h1>Phone Number Store</h1>
        <p>Purchase a private phone number secured by zero-knowledge proofs. Save your secret key — it's the only way to claim your number.</p>
    </header>

    <div class="store-grid" id="store-grid"></div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        const PHONE_NUMBERS = [
            { number: "972501001001", display: "+972 50 100 1001", region: "Israel" },
            { number: "972501001002", display: "+972 50 100 1002", region: "Israel" },
            { number: "972501001003", display: "+972 50 100 1003", region: "Israel" },
            { number: "972501001004", display: "+972 50 100 1004", region: "Israel" },
            { number: "972501001005", display: "+972 50 100 1005", region: "Israel" },
            { number: "972501001006", display: "+972 50 100 1006", region: "Israel" },
            { number: "972501001007", display: "+972 50 100 1007", region: "Israel" },
            { number: "972501001008", display: "+972 50 100 1008", region: "Israel" },
            { number: "972501001009", display: "+972 50 100 1009", region: "Israel" },
            { number: "972501001010", display: "+972 50 100 1010", region: "Israel" },
        ];

        const API_URL = 'https://insert-commitment-esimera-309305771885.europe-west1.run.app';
        const soldNumbers = new Set();

        function renderStore() {
            const grid = document.getElementById('store-grid');
            grid.innerHTML = PHONE_NUMBERS.map((phone, i) => {
                const sold = soldNumbers.has(phone.number);
                return `
                    <div class="product-card" id="card-${i}">
                        <div class="product-icon">📱</div>
                        <div class="product-number">${phone.display}</div>
                        <div class="product-meta">
                            <span>${phone.region}</span>
                            <span class="status-badge ${sold ? 'sold' : 'available'}">
                                ${sold ? 'Sold' : 'Available'}
                            </span>
                        </div>
                        <button class="btn-buy" id="btn-${i}"
                            onclick="purchaseNumber(${i})"
                            ${sold ? 'disabled' : ''}>
                            ${sold ? 'Purchased' : 'Purchase'}
                        </button>
                    </div>
                `;
            }).join('');
        }

        async function purchaseNumber(index) {
            const phone = PHONE_NUMBERS[index];
            const btn = document.getElementById(`btn-${index}`);

            btn.disabled = true;
            btn.className = 'btn-buy processing';
            btn.innerHTML = '<span class="spinner"></span>Processing on-chain...';

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'purchase', label: phone.number })
                });

                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Purchase failed');

                soldNumbers.add(phone.number);
                btn.className = 'btn-buy success';
                btn.textContent = 'Purchased';

                showSecretModal(phone, data);
                renderStore();
            } catch (err) {
                btn.disabled = false;
                btn.className = 'btn-buy';
                btn.textContent = 'Purchase';
                alert('Error: ' + err.message);
            }
        }

        function showSecretModal(phone, data) {
            const claimPageUrl = `${window.location.origin}/claim.html?secret=${encodeURIComponent(data.userSecret)}&label=${encodeURIComponent(phone.number)}`;
            const claimUrl = `arnacon://install?url=${encodeURIComponent(claimPageUrl)}&provider=Arnacon%20Phone%20Store`;
            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(claimUrl)}`;
            const modal = document.getElementById('modal-content');
            modal.innerHTML = `
                <h2>Number Purchased</h2>
                <p>Your phone number <strong>${phone.display}</strong> has been secured on-chain. Copy and save your secret key below — you will need it to claim this number.</p>
                <div class="warning">
                    This secret is shown only once. If you lose it, you cannot recover your number.
                </div>
                <div class="secret-label">Your Secret Key</div>
                <div class="secret-box" id="secret-value">${data.userSecret}</div>
                <button class="btn-copy" id="btn-copy" onclick="copySecret()">Copy Secret Key</button>
                <div class="secret-label" style="margin-top: 20px;">Scan to Claim</div>
                <div style="text-align: center; margin-bottom: 16px;">
                    <img src="${qrApiUrl}" alt="Claim QR Code" style="border-radius: 12px; background: #fff; padding: 12px;" />
                </div>
                <div class="secret-box" id="claim-link" style="font-size: 0.72rem;">${claimUrl}</div>
                <button class="btn-copy" style="margin-top: 0;" onclick="copyClaimLink()">Copy Claim Link</button>
                <div class="tx-link">
                    Tx: <a href="https://polygonscan.com/tx/${data.transactionHash}" target="_blank">${data.transactionHash}</a>
                </div>
            `;
            document.getElementById('modal-overlay').classList.add('active');
        }

        function copySecret() {
            const secret = document.getElementById('secret-value').textContent;
            navigator.clipboard.writeText(secret).then(() => {
                const btn = document.getElementById('btn-copy');
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy Secret Key';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        function copyClaimLink() {
            const link = document.getElementById('claim-link').textContent;
            navigator.clipboard.writeText(link);
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('active');
        }

        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        renderStore();
    </script>
</body>
</html>
