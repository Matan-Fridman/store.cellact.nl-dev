<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provider Setup</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0e0c14;
      color: #e8e4f0;
      min-height: 100vh;
      padding: 48px 24px;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .header {
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #C45BFF, #FF58B0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 14px;
      color: #8b82a8;
    }

    /* ── Cards ── */
    .card {
      background: #16121f;
      border: 1px solid #2a2240;
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #8b82a8;
      margin-bottom: 20px;
    }

    /* ── Fields ── */
    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field-grid .full { grid-column: 1 / -1; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      font-weight: 500;
      color: #a89ec4;
    }

    label .req {
      color: #C45BFF;
      margin-left: 2px;
    }

    label .hint {
      font-weight: 400;
      color: #5e5680;
      margin-left: 6px;
    }

    input, textarea {
      background: #0e0c14;
      border: 1px solid #2a2240;
      border-radius: 10px;
      color: #e8e4f0;
      font-size: 14px;
      font-family: inherit;
      padding: 10px 14px;
      transition: border-color 0.15s;
      width: 100%;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #8E2DE2;
    }

    input::placeholder, textarea::placeholder {
      color: #3d3658;
    }

    input[type="number"] { -moz-appearance: textfield; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

    /* ── Submit ── */
    .submit-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 8px;
    }

    button[type="submit"] {
      background: #fff;
      color: #0e0c14;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 28px;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }

    button[type="submit"]:hover { opacity: 0.88; }
    button[type="submit"]:disabled { opacity: 0.4; cursor: not-allowed; }

    .server-url {
      font-size: 12px;
      color: #5e5680;
    }

    .server-url input {
      background: transparent;
      border: none;
      border-bottom: 1px solid #2a2240;
      border-radius: 0;
      padding: 4px 0;
      font-size: 12px;
      color: #8b82a8;
      width: 280px;
    }

    /* ── Status ── */
    #status {
      display: none;
      margin-top: 24px;
      border-radius: 14px;
      overflow: hidden;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      font-size: 13px;
      font-weight: 500;
    }

    .status-bar.loading { background: #1a1630; color: #C45BFF; }
    .status-bar.success { background: #0f1f18; color: #4ade80; }
    .status-bar.error   { background: #1f0f14; color: #f87171; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid #2a2240;
      border-top-color: #C45BFF;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Result ── */
    #result {
      display: none;
      background: #0a0810;
      border-top: 1px solid #2a2240;
      padding: 20px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
      line-height: 1.7;
      color: #a89ec4;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 420px;
      overflow-y: auto;
    }

    /* key highlights */
    .json-key   { color: #C45BFF; }
    .json-str   { color: #a8d8a8; }
    .json-num   { color: #f9c86a; }
    .json-bool  { color: #ff8c69; }

    /* ── Steps progress ── */
    #steps {
      display: none;
      margin-top: 16px;
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #5e5680;
      transition: color 0.2s;
    }

    .step.done  { color: #4ade80; }
    .step.active { color: #C45BFF; }

    .step-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #2a2240;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .step.done  .step-dot { background: #4ade80; }
    .step.active .step-dot { background: #C45BFF; }
  </style>
</head>
<body>
<div class="page">

  <div class="header">
    <h1>Provider Setup</h1>
    <p>Creates a new wallet, funds it, registers domain, SP, and service on-chain.</p>
  </div>

  <form id="setupForm">

    <!-- ── ENS Domain ── -->
    <div class="card">
      <div class="card-title">Domain</div>
      <div class="field-grid">
        <div class="field full">
          <label>ENS Label <span class="req">*</span> <span class="hint">lowercase, no spaces — becomes name.global</span></label>
          <input type="text" id="name" placeholder="mycompany" pattern="[a-z0-9\-]+" required />
        </div>
        <div class="field">
          <label>Domain Duration <span class="hint">days, default 365</span></label>
          <input type="number" id="durationInDays" placeholder="365" min="1" value="365" />
        </div>
      </div>
    </div>

    <!-- ── Provider Info ── -->
    <div class="card">
      <div class="card-title">Provider Info <span style="font-size:10px;color:#3d3658">— uploaded to IPFS, stored on ServiceProviderRegistry</span></div>
      <div class="field-grid">
        <div class="field full">
          <label>Display Name <span class="req">*</span></label>
          <input type="text" id="pi_displayName" placeholder="My Company" required />
        </div>
        <div class="field full">
          <label>Description</label>
          <input type="text" id="pi_description" placeholder="Phone number provider" />
        </div>
        <div class="field full">
          <label>Website</label>
          <input type="url" id="pi_website" placeholder="https://mycompany.com" />
        </div>
      </div>
    </div>

    <!-- ── Service ── -->
    <div class="card">
      <div class="card-title">Service <span style="font-size:10px;color:#3d3658">— created on ServiceRegistry, linked to the domain</span></div>
      <div class="field-grid">
        <div class="field">
          <label>Service Name <span class="req">*</span> <span class="hint">unique ID</span></label>
          <input type="text" id="svc_serviceName" placeholder="secnum_number" required />
        </div>
        <div class="field">
          <label>Product Identifier <span class="req">*</span></label>
          <input type="text" id="svc_productIdentifier" placeholder="SECNUM" required />
        </div>
        <div class="field full">
          <label>Display Name <span class="req">*</span></label>
          <input type="text" id="svc_name" placeholder="SecNum Number" required />
        </div>
        <div class="field full">
          <label>Description <span class="req">*</span></label>
          <input type="text" id="svc_description" placeholder="Secure phone number" required />
        </div>
        <div class="field full">
          <label>Client URL <span class="req">*</span> <span class="hint">activation / landing page</span></label>
          <input type="url" id="svc_clientUrl" placeholder="https://mycompany.com/activate" required />
        </div>
        <div class="field full">
          <label>Image URL <span class="hint">optional</span></label>
          <input type="url" id="svc_image" placeholder="https://mycompany.com/logo.png" />
        </div>
        <div class="field">
          <label>Price <span class="req">*</span> <span class="hint">PALO tokens</span></label>
          <input type="number" id="svc_servicePrice" placeholder="0" min="0" value="0" required />
        </div>
        <div class="field">
          <label>Duration <span class="req">*</span> <span class="hint">seconds (2592000 = 30d)</span></label>
          <input type="number" id="svc_duration" placeholder="2592000" min="1" value="2592000" required />
        </div>
        <div class="field full">
          <label>Contract Address <span class="req">*</span></label>
          <input type="text" id="svc_contractAddress" placeholder="0xA440Fa68af7A3678Ab9B4DfA2e81258d6e4A349d" pattern="^0x[0-9a-fA-F]{40}$" required />
        </div>
      </div>
    </div>

    <!-- ── Submit ── -->
    <div class="card" style="padding: 20px 28px;">
      <div class="submit-row">
        <button type="submit" id="submitBtn">Run Setup</button>
        <div class="server-url">
          Server: <input type="text" id="serverUrl" value="http://localhost:8083/provider-setup" />
        </div>
      </div>
    </div>

  </form>

  <!-- ── Status + Result ── -->
  <div id="status">
    <div class="status-bar loading" id="statusBar">
      <div class="spinner" id="spinner"></div>
      <span id="statusText">Running setup…</span>
    </div>
    <pre id="result"></pre>
  </div>

</div>

<script>
  const form = document.getElementById('setupForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('status');
  const statusBar = document.getElementById('statusBar');
  const statusText = document.getElementById('statusText');
  const spinner = document.getElementById('spinner');
  const resultEl = document.getElementById('result');

  // ── Persist field values across page reloads ──────────────────────────────

  const FIELDS = [
    'name', 'durationInDays',
    'pi_displayName', 'pi_description', 'pi_website',
    'svc_serviceName', 'svc_productIdentifier', 'svc_name', 'svc_description',
    'svc_clientUrl', 'svc_image', 'svc_servicePrice', 'svc_duration',
    'svc_contractAddress', 'serverUrl',
  ];

  function save() {
    FIELDS.forEach(id => {
      const el = document.getElementById(id);
      if (el) localStorage.setItem('ps_' + id, el.value);
    });
  }

  function restore() {
    FIELDS.forEach(id => {
      const saved = localStorage.getItem('ps_' + id);
      const el = document.getElementById(id);
      if (el && saved !== null) el.value = saved;
    });
  }

  restore();
  FIELDS.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', save);
  });

  // ─────────────────────────────────────────────────────────────────────────

  function val(id) { return document.getElementById(id).value.trim(); }
  function num(id) { return parseFloat(document.getElementById(id).value) || 0; }

  function syntaxHighlight(json) {
    return json
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, (m) => {
        let cls = 'json-num';
        if (/^"/.test(m)) cls = /:$/.test(m) ? 'json-key' : 'json-str';
        else if (/true|false/.test(m)) cls = 'json-bool';
        return `<span class="${cls}">${m}</span>`;
      });
  }

  function setStatus(state, text) {
    statusBar.className = `status-bar ${state}`;
    statusText.textContent = text;
    spinner.style.display = state === 'loading' ? 'block' : 'none';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const contractAddress = val('svc_contractAddress');

    const body = {
      name: val('name'),
      durationInDays: parseInt(val('durationInDays')) || 365,
      providerInfo: {
        displayName: val('pi_displayName'),
        ...(val('pi_description') && { description: val('pi_description') }),
        ...(val('pi_website')     && { website:     val('pi_website') }),
      },
      service: {
        serviceName:       val('svc_serviceName'),
        name:              val('svc_name'),
        description:       val('svc_description'),
        clientUrl:         val('svc_clientUrl'),
        ...(val('svc_image') && { image: val('svc_image') }),
        productIdentifier: val('svc_productIdentifier'),
        servicePrice:      num('svc_servicePrice'),
        duration:          parseInt(val('svc_duration')) || 2592000,
        contractAddress,
      },
    };

    const serverUrl = val('serverUrl');

    submitBtn.disabled = true;
    statusEl.style.display = 'block';
    resultEl.style.display = 'none';
    setStatus('loading', 'Running setup… this will take a few minutes');

    try {
      const res = await fetch(serverUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      const data = await res.json();
      const pretty = JSON.stringify(data, null, 2);

      if (res.ok) {
        setStatus('success', 'Setup complete');
      } else {
        setStatus('error', `Error — ${data.error || res.statusText}`);
      }

      resultEl.innerHTML = syntaxHighlight(pretty);
      resultEl.style.display = 'block';
    } catch (err) {
      setStatus('error', `Request failed — ${err.message}`);
      resultEl.textContent = err.message;
      resultEl.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
